# Every action is pinned by full commit SHA, GitHub's own included, since a
# tag can be moved, with the release tag on that commit in a comment, which
# Dependabot rewrites when it moves the pin: the pinning rule of every workflow
# in the project (the owner's decisions of 2026-10-25, "CI tools - pin." and
# "Stay current"; in full in core's .github/workflows/ci.yml header). Core's
# ci/pinned-actions.sh checks the form when given this directory.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a deploy that has started finish; a newer run waits for it.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
